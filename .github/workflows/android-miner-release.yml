name: Build WAM Coin Android Miner (Self-Hosted)

on:
  push:
    branches:
      - wam-miner-android-test
    paths:
      - 'contrib/wam-miner-android/**'
      - '.github/workflows/android-miner-release.yml'
  workflow_dispatch:

jobs:
  # STAGE 1: Runs independently on WSL/Linux
  prepare-miner:
    name: 1. Prepare miner for Gradle Build
    if: github.repository == 'gvsa/wam-coin'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contrib/wam-miner-android

    steps:
      - name: Clean Workspace
        working-directory: ${{ github.workspace }}
        run: rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]*
        
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make Prep Scripts Executable
        run: chmod +x setup-dependencies.sh build-upstream-for-arm.sh prepare-miner-code.sh

      - name: Setup build environment
        run: |
          ./setup-dependencies.sh

      - name: Build librandomx for arm
        run: |
          ./build-upstream-for-arm.sh

      - name: Prepare the miner code for Gradle Build
        run: |
          ./prepare-miner-code.sh

      - name: Upload Prepared Android Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepared-android-project
          path: contrib/wam-miner-android
          include-hidden-files: true
          retention-days: 1

  # STAGE 2: Runs independently on Windows
  build-windows-apk:
    name: 2. Build Signed APK on Windows
    if: github.repository == 'gvsa/wam-coin'
    needs: prepare-miner
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: contrib/wam-miner-android

    steps:
      - name: Clean Workspace
        working-directory: ${{ github.workspace }}
        run: |
          @echo off
          for /d %%D in (*) do rmdir /s /q "%%D"
          del /f /q /a * >nul 2>&1
          exit /b 0

      - name: Download Prepared Android Project
        uses: actions/download-artifact@v4
        with:
          name: prepared-android-project
          path: contrib/wam-miner-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            contrib/wam-miner-android/**/*.gradle*
            contrib/wam-miner-android/**/gradle-wrapper.properties

      - name: Accept Licenses & Install CMake 3.22.1
        run: |
          @echo off
          (for /l %%i in (1,1,10) do @echo y) | "%ANDROID_HOME%\cmdline-tools\16.0\bin\sdkmanager.bat" --licenses >nul
          call "%ANDROID_HOME%\cmdline-tools\16.0\bin\sdkmanager.bat" "cmake;3.22.1"

      - name: Decode Keystore
        shell: python
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
        run: |
          import os
          import base64

          keystore_path = os.environ["ANDROID_KEYSTORE_PATH"]
          parent_dir = os.path.dirname(keystore_path)

          if parent_dir:
              os.makedirs(parent_dir, exist_ok=True)

          keystore_bytes = base64.b64decode(os.environ["KEYSTORE_B64"])

          with open(keystore_path, "wb") as f:
              f.write(keystore_bytes)

      - name: Build Signed APK via Android SDK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradlew.bat assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wam-miner-android-apk
          path: contrib/wam-miner-android/app/build/outputs/apk/release/wam-miner-android.apk
          retention-days: 14
