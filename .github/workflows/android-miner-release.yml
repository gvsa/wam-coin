name: Build WAM Coin Android Miner

on:
  push:
    branches:
      - wam-miner-android-test
    paths:
      - 'contrib/wam-miner-android/**'
      - '.github/workflows/android-miner-release.yml'
  workflow_dispatch:

jobs:
  # STAGE 1: Runs independently on Linux (Cached without touching .sh files)
  prepare-miner:
    name: 1. Prepare miner for Gradle Build
    if: github.repository == 'gvsa/wam-coin'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contrib/wam-miner-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Linux Android SDK & NDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk
          key: linux-android-sdk-${{ hashFiles('contrib/wam-miner-android/setup-dependencies.sh') }}

      - name: Make Prep Scripts Executable
        run: chmod +x setup-dependencies.sh build-upstream-for-arm.sh prepare-miner-code.sh

      - name: Setup build environment
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: ./setup-dependencies.sh

      - name: Build librandomx for arm
        run: ./build-upstream-for-arm.sh

      - name: Prepare the miner code for Gradle Build
        run: ./prepare-miner-code.sh

      - name: Upload Prepared Android Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepared-android-project
          path: contrib/wam-miner-android
          include-hidden-files: true
          retention-days: 1

  # STAGE 2: Runs independently on Windows using cmd
  build-windows-apk:
    name: 2. Build Signed APK on Windows
    if: github.repository == 'gvsa/wam-coin'
    needs: prepare-miner
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: contrib/wam-miner-android

    steps:
      - name: Download Prepared Android Project
        uses: actions/download-artifact@v4
        with:
          name: prepared-android-project
          path: contrib/wam-miner-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            contrib/wam-miner-android/**/*.gradle*
            contrib/wam-miner-android/**/gradle-wrapper.properties

      - name: Cache Windows Android SDK Packages
        id: cache-win-sdk
        uses: actions/cache@v4
        with:
          path: |
            C:\Android\android-sdk\build-tools\28.0.3
            C:\Android\android-sdk\platforms\android-28
            C:\Android\android-sdk\cmake\3.22.1
            C:\Android\android-sdk\ndk\21.4.7075529
            C:\Android\android-sdk\licenses
          key: win-android-sdk-28-ndk21-cmake3221

      - name: Accept Licenses & Install Android SDK Packages
        if: steps.cache-win-sdk.outputs.cache-hit != 'true'
        run: |
          @echo off
          (for /l %%i in (1,1,15) do @echo y) | "%ANDROID_HOME%\cmdline-tools\16.0\bin\sdkmanager.bat" --licenses >nul
          call "%ANDROID_HOME%\cmdline-tools\16.0\bin\sdkmanager.bat" "build-tools;28.0.3" "platform-tools" "platforms;android-28" "cmake;3.22.1" "ndk;21.4.7075529"

      - name: Decode Keystore
        shell: python
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
        run: |
          import os
          import base64

          keystore_path = os.environ["ANDROID_KEYSTORE_PATH"]
          parent_dir = os.path.dirname(keystore_path)

          if parent_dir:
              os.makedirs(parent_dir, exist_ok=True)

          with open(keystore_path, "wb") as f:
              f.write(base64.b64decode(os.environ["KEYSTORE_B64"]))

      - name: Build Signed APK via Android SDK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradlew.bat assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wam-miner-android-apk
          path: contrib/wam-miner-android/app/build/outputs/apk/release/wam-miner-android.apk
          retention-days: 14
