name: Build WAM Coin Android Miner

on:
  push:
    branches:
      - wam-miner-android-test
    paths:
      - 'contrib/wam-miner-android/**'
      - '.github/workflows/android-miner-build.yml'
  workflow_dispatch:

jobs:
  # STAGE 1: Prepare dependencies, build native libs, and compile signed APK on Linux
  prepare-and-build-apk:
    name: 1. Prepare & Build Signed APK (Linux)
    if: github.repository == 'gvsa/wam-coin'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contrib/wam-miner-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 (Compiles Java 11 bytecode target)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            contrib/wam-miner-android/**/*.gradle*
            contrib/wam-miner-android/**/gradle-wrapper.properties
            contrib/wam-miner-android/gradle/libs.versions.toml

      - name: Cache Android SDK & NDK Packages
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/build-tools/33.0.2
            /usr/local/lib/android/sdk/platforms/android-33
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/21.4.7075529
            /usr/local/lib/android/sdk/licenses
          key: linux-android-sdk-33-ndk21-cmake3221-v1

      - name: Make Prep Scripts Executable
        run: chmod +x setup-dependencies.sh build-upstream-for-arm.sh prepare-miner-code.sh gradlew

      - name: Install Native Build Tools & Android NDK/CMake
        run: ./setup-dependencies.sh

      - name: Build librandomx for arm
        run: ./build-upstream-for-arm.sh

      - name: Prepare the miner code for Gradle Build
        run: ./prepare-miner-code.sh

      - name: Decode Keystore
        shell: python
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
        run: |
          import os
          import base64

          keystore_bytes = base64.b64decode(os.environ["KEYSTORE_B64"])
          target = os.path.join("app", os.environ["ANDROID_KEYSTORE_PATH"])
          os.makedirs(os.path.dirname(target), exist_ok=True)

          with open(target, "wb") as f:
              f.write(keystore_bytes)

      - name: Build Signed APK via Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wam-miner-android-apk
          path: contrib/wam-miner-android/app/build/outputs/apk/release/wam-miner-android.apk
          retention-days: 14

  # STAGE 2: Runs sanity test on a Windows runner with Appium already installed
  qa:
    name: 2. Run Appium Sanity Tests
    if: github.repository == 'gvsa/wam-coin'
    needs: prepare-and-build-apk
    runs-on: [self-hosted, Windows, gvs]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: contrib/wam-miner-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Signed APK
        uses: actions/download-artifact@v4
        with:
          name: wam-miner-android-apk
          path: contrib/wam-miner-android/app/build/outputs/apk/release

      - name: Start Appium & Run Sanity Suite (app_sanity.xml)
        working-directory: contrib/wam-miner-android/ui-tests
        run: |
          @echo off
          setlocal enabledelayedexpansion

          REM 1. Resolve full path of the downloaded APK
          set "APK_REL=..\app\build\outputs\apk\release\wam-miner-android.apk"
          if not exist "%APK_REL%" (
            echo Error: APK not found at %APK_REL%!
            exit /b 1
          )
          for %%F in ("%APK_REL%") do set "APK_FILE=%%~fF"

          set "APPIUM_IP=127.0.0.1"
          set "APPIUM_PORT=4723"
          set "STATUS_URL=http://%APPIUM_IP%:%APPIUM_PORT%/status"

          REM 2. Start Appium in the background
          start /b "" cmd /c "appium.cmd --address %APPIUM_IP% --port %APPIUM_PORT% --log-level info > appium.log 2> appium-err.log"

          REM 3. Poll Appium status up to 15 times (30 seconds)
          set "READY=0"
          for /l %%i in (1,1,15) do (
            curl -s "%STATUS_URL%" | findstr /R "\"ready\":[ ]*true" >nul 2>&1
            if not errorlevel 1 (
              set "READY=1"
              echo Appium server is ready at %STATUS_URL%!
              goto :appium_ready
            )
            ping -n 3 127.0.0.1 >nul
          )

          if "%READY%"=="0" (
            echo Error: Appium server failed to start within 30 seconds.
            if exist appium-err.log type appium-err.log
            exit /b 1
          )

          :appium_ready
          echo Testing APK: %APK_FILE%
          call mvn test "-DsuiteXmlFile=suites/app_sanity.xml" "-Dapk.path=%APK_FILE%"
          exit /b %ERRORLEVEL%

      - name: Upload Appium Logs & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: |
            contrib/wam-miner-android/ui-tests/appium.log
            contrib/wam-miner-android/ui-tests/appium-err.log
            contrib/wam-miner-android/ui-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Appium & Uninstall App
        if: always()
        run: |
          @echo off
          for /f "tokens=5" %%P in ('netstat -ano ^| findstr :4723 ^| findstr LISTENING') do (
            taskkill /F /PID %%P >nul 2>&1
          )
          adb uninstall org.vslabs.wam_miner >nul 2>&1
          exit /b 0
