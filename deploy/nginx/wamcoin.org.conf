# The website, served from machines this project owns.
#
# =========================================================================
#  WHY THIS FILE EXISTS
# =========================================================================
#
#  wamcoin.org pointed at GitHub Pages until 2026-09-24. That day the
#  account was suspended and the domain returned 404 to everybody: the
#  documentation, the download instructions and the security page, all gone
#  at once, because the front door of the project was somebody else's
#  machine.
#
#  This file is the answer, and the rule that goes with it is short:
#
#      THE DOMAIN POINTS AT OUR OWN SERVERS AND IS NEVER MOVED AGAIN.
#
#  When GitHub comes back it becomes a mirror of the code, nothing more. No
#  service anybody depends on is reached through a third party's hostname
#  again, because the thing that failed was not GitHub -- it was having one
#  address with one owner behind it.
#
#  It is installed on MORE THAN ONE host, with an A record for each, so a
#  browser that cannot reach the first tries the next by itself. Losing a
#  machine is then a slow page, not an outage.
#
#  The content comes straight from the deployed checkout at /opt/wam/site,
#  which deploy.sh keeps at origin/main on every host. Nothing is copied, so
#  nothing can be stale in one place and fresh in another.
#
#  INSTALL
#
#      cp wam-site-locations.conf /etc/nginx/snippets/
#      cp wamcoin.org.conf        /etc/nginx/sites-available/wamcoin.org
#      ln -s ../sites-available/wamcoin.org /etc/nginx/sites-enabled/
#
#  On the host that answers ACME challenges, leave the challenge block as it
#  is. On every other host, replace it with a proxy_pass to that host -- see
#  the comment on it below.
#
#  THE SECOND NAME, AND WHY IT SERVES RATHER THAN FORWARDS
#
#  wamcoin.net was registered on 2026-09-27 as the way back from losing
#  wamcoin.org, and until 2026-10-04 it was a 301 forward at the registrar
#  pointing at wamcoin.org. That is not a way back, for two reasons, and the
#  second one arrived on its own:
#
#    * it forwarded TO the name it exists to replace. Losing wamcoin.org
#      would have taken the forward's destination with it.
#
#    * it depended on a free service at a third party. On 2026-10-04 all
#      three of the registrar's forwarding addresses stopped answering on
#      port 80 -- settings untouched and correct -- and the second name was
#      simply gone from the web. That is the same shape of dependency that
#      cost this project its repository, its downloads and its website in one
#      minute on 2026-09-24.
#
#  So it is served here, from our own machines, out of the same /opt/wam/site
#  the deploy keeps current. Not a copy and not a redirect: the same files,
#  answered under either name. Pages carry <link rel="canonical"> pointing at
#  wamcoin.org, so while that name lives it stays the one search engines and
#  readers are sent to, and if it ever does not, nothing has to be moved.
#
#  INSTALL ORDER FOR THE SECOND NAME -- and it is an order, not a list.
#
#  Between the DNS pointing here and the certificate existing, HTTPS on the
#  new name presents a certificate for wamcoin.org and every browser calls it
#  an impostor. That window has to be short and deliberate rather than
#  discovered.
#
#    1. DNS: A records for wamcoin.net and www.wamcoin.net at the same
#       addresses wamcoin.org already uses. Registrar forwarding OFF -- it
#       overrides the name servers and would undo this.
#
#    2. Confirm port 80 reaches us under the new name before asking the CA
#       for anything:
#           curl -sI http://wamcoin.net/ | head -1
#
#    3. On the ACME host only, add the names to the existing certificate:
#           certbot certonly --webroot -w /var/www/html \
#               --cert-name wamcoin.org --expand \
#               -d wamcoin.org -d www.wamcoin.org \
#               -d wamcoin.net -d www.wamcoin.net
#       --expand keeps one lineage and one renewal. A second certificate for
#       the second name is a second thing to forget.
#
#    4. Copy the renewed fullchain/privkey to the other hosts as the existing
#       procedure does, then on each:
#           nginx -t && systemctl reload nginx
#
#    5. Prove it as a stranger, on both names. The second line checks that
#       the pages served under the new name are byte-identical to this
#       repository, which is the whole claim being made:
#           curl -sI https://wamcoin.net/ | head -1
#           WAM_SITE=https://wamcoin.net python3 scripts/check_site_published.py
#
#  Step 3 before step 4. nginx will start happily with a certificate that
#  does not cover a name it answers for, and say nothing.
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wamcoin.org www.wamcoin.org wamcoin.net www.wamcoin.net;

    # The ACME challenge, and why it is not simply a local directory.
    #
    # The domain has an A record for every host that serves it, which is what
    # makes losing one of them survivable. It also means Let's Encrypt picks
    # ONE of those addresses at random when it verifies ownership -- and the
    # token it looks for exists only on the machine where certbot ran.
    # Issuing on each host independently therefore fails about half the time,
    # per domain, for reasons that read like a DNS fault and are not one.
    #
    # So one host answers the challenge for all of them, and every other host
    # proxies this path to it:
    #
    #     location /.well-known/acme-challenge/ {
    #         proxy_pass http://<the acme host>;
    #         proxy_set_header Host $host;
    #     }
    #
    # Renewal then works whichever address the CA happens to ask, today and
    # in sixty days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include snippets/wam-site-locations.conf;

    access_log /var/log/nginx/wamcoin.org.access.log;
    error_log  /var/log/nginx/wamcoin.org.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wamcoin.org www.wamcoin.org wamcoin.net www.wamcoin.net;

    # certbot writes these on the ACME host. Every other host receives a copy
    # and points at /etc/ssl/wamcoin.org/ instead.
    #
    # ONE CERTIFICATE FOR BOTH NAMES. The file is still called wamcoin.org
    # because that is the lineage certbot created and renaming a live
    # certificate lineage is a way to lose a site for an afternoon; the names
    # inside it are what matter, and `certbot certificates` lists them.
    ssl_certificate     /etc/letsencrypt/live/wamcoin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wamcoin.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:wam:10m;

    include snippets/wam-site-locations.conf;

    access_log /var/log/nginx/wamcoin.org.access.log;
    error_log  /var/log/nginx/wamcoin.org.error.log;
}
