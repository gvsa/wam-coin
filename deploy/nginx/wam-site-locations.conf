# The paths of wamcoin.org, written once and included by both server blocks.
#
# =========================================================================
#  WHY THIS IS A SEPARATE FILE
# =========================================================================
#
#  The HTTP and HTTPS blocks serve the same site, so every location existed
#  twice. On 2026-09-24 three paths were added to one of them and not the
#  other, and because HTTPS is what a visitor actually reaches, the three
#  documented URLs for the signing key and the verifier scripts returned 404
#  while the copy nobody reaches was perfect.
#
#  Anything true of both blocks belongs here, included twice. A fact written
#  in two places is a fact that will disagree with itself.
# =========================================================================

root /opt/wam/site;
index index.html;

# STORE IT, BUT ASK US BEFORE USING IT.
#
# Nothing here sent any cache header at all, and a response with no
# Cache-Control and no Expires lets a browser GUESS how long it may keep the
# page. The usual guess is a tenth of the age since Last-Modified, so the
# longer a page goes without being corrected, the longer a reader may be
# served the version before the correction. The pages least often edited are
# cached the longest, which is precisely backwards.
#
# Found on 2026-10-04: the founder could not see a paragraph added to the
# front page that morning. It was live -- fetched from the server to prove it
# -- and his browser was within its rights to show him the previous one for
# about five hours, because the page had last changed two days earlier.
#
# That is not an inconvenience for one reader. This project's whole claim is
# that what it says can be checked and that its mistakes are corrected in
# public. A correction nobody is served is not published. The false sentence
# about the founder mining was corrected that same morning.
#
# `no-cache` does not mean "do not store". It means "revalidate before use":
# the browser keeps the copy and sends a conditional request, which returns
# 304 with no body when nothing changed. The cost is a round trip of headers.
#
# .asc and .txt are in here for a sharper reason than freshness. CHANNELS.txt
# is the signed list of who we are and SHA256SUMS is the list a download is
# checked against; a reader verifying a stale copy of either is doing the one
# thing those files exist to let him do, against the wrong bytes.
#
# The header itself is set with the others at the foot of this file, not in a
# location of its own. A `location ~* \.html$` would not have covered the one
# page that prompted all this: the request for the front page is for `/`, and
# `/` does not end in .html -- try_files resolves it to index.html AFTER the
# location has already been chosen. The header would have been added to every
# page except the one a reader lands on.
location / {
    try_files $uri $uri/ $uri.html =404;
}

# The releases, served from a machine this project owns.
#
# Every archive here is byte-identical to the one that was signed -- checked
# against SHA256SUMS before it was uploaded, not assumed -- and
# SHA256SUMS.asc sits beside it. The host is irrelevant to whether a download
# can be trusted, which is the whole point of signing them: when the old
# download URLs disappeared, nothing about their verifiability went too.
#
# autoindex on purpose. A directory a person can read is a directory a person
# can check, and there is nothing here not meant to be downloaded.
location /downloads/ {
    alias /var/www/wam-downloads/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    types { } default_type application/octet-stream;
    # ADD_HEADER DOES NOT ADD. IT REPLACES THE WHOLE SET.
    #
    # nginx inherits add_header from the enclosing level only when the current
    # level declares none of its own. This block declares Content-Disposition,
    # so from that line onward it stopped inheriting the four at the foot of
    # this file -- and nothing said so. Measured on 2026-10-04: the front page
    # returns X-Content-Type-Options, X-Frame-Options and Referrer-Policy, and
    # /downloads/v0.1.11/SHA256SUMS returns none of them. It has been that way
    # since the downloads moved onto our own machines.
    #
    # nosniff matters most of all here, on the one directory that serves files
    # a stranger is told to download and run.
    #
    # So they are repeated, in full, and a header added at the foot of this
    # file has to be added here too. That is nginx's rule, not a choice.
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # SHA256SUMS and its signature live under this path, and a reader
    # verifying a stale copy of either is doing the one thing they exist for
    # against the wrong bytes. Revalidation of an archive costs a 304, not a
    # second download.
    add_header Cache-Control "no-cache" always;
}

# The signing key and the two verifier scripts, from the deployed checkout so
# they cannot drift from the source they came from. They used to be fetched
# from raw.githubusercontent.com, which made "check this download against our
# key" depend on a third party staying reachable. A verification step that
# somebody else's outage can take offline is not a verification step.
location = /SIGNING-KEY.asc    { alias /opt/wam/SIGNING-KEY.asc;             default_type text/plain; }
location = /verify_release.sh  { alias /opt/wam/scripts/verify_release.sh;   default_type text/plain; }
location = /verify_release.ps1 { alias /opt/wam/scripts/verify_release.ps1;  default_type text/plain; }

# The site is static files and nothing else. No upload path, no interpreter,
# no proxy: a web server with nothing to execute cannot be made to execute
# anything.
location ~* \.(php|cgi|pl|py|sh)$ { return 404; }

# A dotfile under the document root is a mistake, not a page.
location ~ /\.(?!well-known) { deny all; }

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control "no-cache" always;
